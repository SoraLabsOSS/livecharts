name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        # Publish the tagged commit, not main tip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run check-types --filter=@livecharts/core --filter=@livecharts/react --filter=@livecharts/vue --filter=livecharts

      - run: bun run test --filter=@livecharts/core
      - run: bun run test --filter=@livecharts/react
      - run: bun run test --filter=@livecharts/vue

      - run: bun run build --filter=@livecharts/core --filter=@livecharts/react --filter=@livecharts/vue --filter=livecharts

      - name: Verify pack has no workspace runtime deps
        working-directory: packages/livecharts
        run: |
          node -e "const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ''); const version=require('./package.json').version; if (tag !== version) { console.error(\`tag ${tag} != package ${version}\`); process.exit(1) }"
          npm pack --dry-run
          node -e "const p=require('./package.json'); if (JSON.stringify(p.dependencies||{}).includes('workspace:')) { console.error('workspace in dependencies'); process.exit(1) }"
          test -f dist/data/index.js
          test -f dist/data/index.d.ts
          test -f dist/react/index.js
          test -f dist/react/index.d.ts
          test -f dist/vue/index.js
          test -f dist/vue/index.d.ts
          node --input-type=module -e "const m=await import('./dist/data/index.js'); if(typeof m.createWalker!=='function'||typeof m.aggregateCandles!=='function') process.exit(1)"
          node -e "const m=require('./dist/data/index.cjs'); if(typeof m.createWalker!=='function'||typeof m.aggregateCandles!=='function') process.exit(1)"
          node -e "const s=require('fs').readFileSync('dist/data/index.js','utf8'); if(s.includes('LiveChartEngine')) { console.error('data entry bundled chart engine'); process.exit(1) }"
          node -e "const s=require('fs').readFileSync('dist/react/index.js','utf8'); if(s.includes('from \"vue\"')||s.includes(\"from 'vue'\")) { console.error('react entry imports vue'); process.exit(1) }"
          node -e "const s=require('fs').readFileSync('dist/vue/index.js','utf8'); if(s.includes('from \"react\"')||s.includes(\"from 'react'\")) { console.error('vue entry imports react'); process.exit(1) }"
          rm -f livecharts-*.tgz

      - name: Publish livecharts
        run: npm publish --access public --provenance
        working-directory: packages/livecharts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
